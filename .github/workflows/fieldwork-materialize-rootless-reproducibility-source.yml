name: Materialize Fieldwork rootless reproducibility source

on:
  push:
    branches:
      - fieldwork/rootless-reproducibility-source
    paths:
      - ".github/workflows/fieldwork-materialize-rootless-reproducibility-source.yml"

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fieldwork/rootless-reproducibility-source
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize exact tested product generation
        run: |
          git fetch origin linux-fieldwork/rootless-reproducibility
          git show origin/linux-fieldwork/rootless-reproducibility:linux-fieldwork/0001-executor-clean-finalized-oci-mount-stubs.patch > /tmp/candidate.patch
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          git show origin/linux-fieldwork/rootless-reproducibility:executor/stubs_spec_test.go > executor/stubs_spec_test.go
          gofmt -w \
            executor/stubs.go \
            executor/stubs_spec_test.go \
            executor/runcexecutor/executor.go \
            executor/containerdexecutor/executor.go \
            executor/containerdexecutor/executor_unix.go
          git diff --check
          go test ./executor

      - name: Commit direct source candidate
        run: |
          git config user.name "linux-fieldwork-bot"
          git config user.email "linux-fieldwork@example.invalid"
          git add \
            executor/stubs.go \
            executor/stubs_spec_test.go \
            executor/runcexecutor/executor.go \
            executor/containerdexecutor/executor.go \
            executor/containerdexecutor/executor_unix.go
          git commit -m "executor: clean finalized OCI mount stubs"
          git push origin HEAD:fieldwork/rootless-reproducibility-source
