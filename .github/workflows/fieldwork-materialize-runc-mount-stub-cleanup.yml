name: Materialize runc mount-stub cleanup

on:
  pull_request:
    paths:
      - .github/workflows/fieldwork-materialize-runc-mount-stub-cleanup.yml

permissions:
  contents: write

concurrency:
  group: materialize-runc-mount-stubs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_BASE: df0761886a20e368d75e0aa6bb3f20874f58b692

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check out accepted evidence carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teamleaderleo/buildkit
          ref: fe658b9120fc175f12c83a58ff925c2a1ea20ed2
          persist-credentials: false
          path: accepted-carrier

      - name: Apply only the proven runc source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git diff --name-only "$SOURCE_BASE" HEAD)" = .github/workflows/fieldwork-materialize-runc-mount-stub-cleanup.yml

          git apply --check \
            --include=executor/stubs.go \
            --include=executor/runcexecutor/executor.go \
            accepted-carrier/linux-fieldwork/0001-executor-clean-finalized-oci-mount-stubs.patch
          git apply \
            --include=executor/stubs.go \
            --include=executor/runcexecutor/executor.go \
            accepted-carrier/linux-fieldwork/0001-executor-clean-finalized-oci-mount-stubs.patch
          cp accepted-carrier/executor/stubs_spec_test.go executor/stubs_spec_test.go
          git add -N executor/stubs_spec_test.go
          rm .github/workflows/fieldwork-materialize-runc-mount-stub-cleanup.yml

          test "$(git diff --name-only "$SOURCE_BASE" | sort)" = $'executor/runcexecutor/executor.go\nexecutor/stubs.go\nexecutor/stubs_spec_test.go'
          gofmt -w executor/stubs.go executor/stubs_spec_test.go executor/runcexecutor/executor.go
          git diff --check "$SOURCE_BASE"

      - name: Run executor unit tests
        run: go test ./executor

      - name: Build candidate binaries
        run: |
          mkdir -p bin
          go build -trimpath -o bin/buildkitd ./cmd/buildkitd
          go build -trimpath -o bin/buildctl ./cmd/buildctl

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rootlesskit runc uidmap
          user=$(id -un)
          grep -q "^${user}:" /etc/subuid || echo "${user}:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^${user}:" /etc/subgid || echo "${user}:100000:65536" | sudo tee -a /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Start matching runc workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bk-rootful /tmp/bk-rootless /tmp/bk-rootless-runtime /tmp/bk-rootlesskit
          sudo ./bin/buildkitd \
            --root /tmp/bk-rootful \
            --addr unix:///tmp/bk-rootful.sock \
            --oci-worker-snapshotter=native \
            --containerd-worker=false \
            >/tmp/buildkitd-rootful.log 2>&1 &
          echo $! >/tmp/buildkitd-rootful.pid

          XDG_RUNTIME_DIR=/tmp/bk-rootless-runtime \
          rootlesskit \
            --state-dir=/tmp/bk-rootlesskit \
            --net=host \
            ./bin/buildkitd \
              --root /tmp/bk-rootless \
              --addr unix:///tmp/bk-rootless.sock \
              --oci-worker-snapshotter=native \
              --containerd-worker=false \
            >/tmp/buildkitd-rootless.log 2>&1 &
          echo $! >/tmp/buildkitd-rootless.pid

          for _ in $(seq 1 120); do
            if [ -S /tmp/bk-rootful.sock ] && [ -S /tmp/bk-rootless.sock ]; then
              sudo chmod 666 /tmp/bk-rootful.sock
              exit 0
            fi
            sleep 1
          done

          cat /tmp/buildkitd-rootful.log
          cat /tmp/buildkitd-rootless.log
          exit 1

      - name: Verify implicit mountpoint parity
        shell: bash
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" \
          ROOTFUL_ADDR=unix:///tmp/bk-rootful.sock \
          ROOTLESS_ADDR=unix:///tmp/bk-rootless.sock \
          /bin/sh accepted-carrier/linux-fieldwork/repro-rootless-oci.sh \
            | tee /tmp/rootless-repro-implicit.log

      - name: Verify pre-existing mountpoints are preserved
        shell: bash
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" \
          ROOTFUL_ADDR=unix:///tmp/bk-rootful.sock \
          ROOTLESS_ADDR=unix:///tmp/bk-rootless.sock \
          PRECREATE_RUNTIME_DIRS=1 \
          /bin/sh accepted-carrier/linux-fieldwork/repro-rootless-oci.sh \
            | tee /tmp/rootless-repro-explicit.log

      - name: Stop workers
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/bk-rootless.pid ]; then kill "$(cat /tmp/bk-rootless.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/bk-rootful.pid ]; then sudo kill "$(cat /tmp/bk-rootful.pid)" 2>/dev/null || true; fi

      - name: Commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            executor/stubs.go \
            executor/stubs_spec_test.go \
            executor/runcexecutor/executor.go \
            .github/workflows/fieldwork-materialize-runc-mount-stub-cleanup.yml
          git commit -m $'executor: clean finalized runc mount stubs\n\nAssisted-by: ChatGPT (GPT-5.6 Thinking)'
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runc-finalized-mount-stub-cleanup
          if-no-files-found: warn
          path: |
            /tmp/buildkitd-rootful.log
            /tmp/buildkitd-rootless.log
            /tmp/rootless-repro-implicit.log
            /tmp/rootless-repro-explicit.log
