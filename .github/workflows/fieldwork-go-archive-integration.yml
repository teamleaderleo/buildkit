name: Fieldwork go-archive integration

on:
  pull_request:
    branches:
      - fieldwork/go-archive-current-base

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out BuildKit carrier
        uses: actions/checkout@v4

      - name: Check out repaired go-archive
        uses: actions/checkout@v4
        with:
          repository: moby/go-archive
          ref: 9e6d2c7c969f4871fe6ded98ae0e28963fde311f
          path: go-archive-current

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: edge
          driver-opts: image=moby/buildkit:latest
          buildkitd-flags: --debug

      - name: Materialize ephemeral dependency replacement
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C go-archive-current rev-parse HEAD)" = "9e6d2c7c969f4871fe6ded98ae0e28963fde311f"
          go mod edit -replace "github.com/moby/go-archive=${GITHUB_WORKSPACE}/go-archive-current"
          go mod tidy
          go mod vendor
          git diff --check

      - name: Run focused BuildKit archive integration
        env:
          TESTPKGS: ./frontend/dockerfile
          TESTFLAGS: >-
            -v -count=1 -run=TestIntegration/(TestDockerfileAddArchiveWithImpliedParentDir|TestDockerfileAddArchiveThroughAbsoluteSymlink)/worker=oci
        shell: bash
        run: |
          set -euxo pipefail
          ./hack/test integration

      - name: Verify carrier cleanup boundary
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(git -C go-archive-current status --short)"
          ! docker ps -aq --filter name=buildkit-test-cache | grep -q .
