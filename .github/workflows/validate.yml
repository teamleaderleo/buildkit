name: validate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'v[0-9]+.[0-9]+'
    tags:
      - 'v*'
      - 'dockerfile/*'
  pull_request:

env:
  SETUP_BUILDX_VERSION: "edge"
  SETUP_BUILDKIT_IMAGE: "moby/buildkit:latest"

jobs:
  linux-fieldwork-repair:
    if: >-
      github.repository == 'teamleaderleo/buildkit' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repair/unused-context-lazy-load-e19f177
          fetch-depth: 0
      - name: Apply and format repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/apply_unused_context_repair.py
          gofmt -w frontend/dockerfile/dockerfile2llb/convert.go frontend/dockerfile/dockerfile_context_access_test.go
          git diff --check
      - name: Compile affected packages
        shell: bash
        run: |
          set -euxo pipefail
          go test ./frontend/dockerfile/dockerfile2llb
          go test ./frontend/dockerfile -run '^$'
      - name: Commit repair branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Linux Fieldwork'
          git config user.email 'fieldwork@example.invalid'
          git add frontend/dockerfile/dockerfile2llb/convert.go frontend/dockerfile/dockerfile_context_access_test.go
          git commit -m 'dockerfile: load local context only when consumed'
          git push origin HEAD:repair/unused-context-lazy-load-e19f177

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      includes: ${{ steps.matrix.outputs.includes }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Generate matrix
        id: generate
        uses: docker/bake-action/subaction/matrix@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          target: validate
          fields: platforms
        env:
          GOLANGCI_LINT_MULTIPLATFORM: ${{ github.repository == 'moby/buildkit' && '1' || '' }}
          ARCHUTIL_MULTIPLATFORM: ${{ github.repository == 'moby/buildkit' && '1' || '' }}
      -
        name: Add runner to matrix
        id: matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_MATRIX: ${{ steps.generate.outputs.matrix }}
          INPUT_PRIVATE-REPO: ${{ github.event.repository.private }}
        with:
          script: |
            const matrix = JSON.parse(core.getInput('matrix'));
            const privateRepo = core.getBooleanInput('private-repo');
            matrix.forEach(job => {
              if (job.platforms && job.platforms.startsWith('linux/arm') && !privateRepo) {
                job.runner = 'ubuntu-24.04-arm';
              } else {
                job.runner = 'ubuntu-24.04';
              }
            });
            core.info(JSON.stringify(matrix, null, 2));
            core.setOutput('includes', JSON.stringify(matrix));

  validate:
    runs-on: ${{ matrix.runner }}
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.includes) }}
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.SETUP_BUILDX_VERSION }}
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
      -
        name: Validate
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}