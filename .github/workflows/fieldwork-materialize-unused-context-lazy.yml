name: Fieldwork materialize unused default context repair

on:
  pull_request:
    branches:
      - linux-fieldwork/upstream-master-snapshot-2026-08-03
    paths:
      - .github/fieldwork/apply-unused-context-lazy.py
      - .github/patches/unused-context-lazy-main-context.patch
      - .github/workflows/fieldwork-materialize-unused-context-lazy.yml
      - frontend/dockerfile/dockerfile_context_access_test.go
      - frontend/dockerfile/dockerfile2llb/convert.go
  push:
    branches:
      - research/unused-context-lazy-load
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-unused-context-lazy-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 275d6864ff0ce91a06225af5f5b012887bd257cf

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact controlled head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply fail-closed candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python3 .github/fieldwork/apply-unused-context-lazy.py
          gofmt -w \
            frontend/dockerfile/dockerfile2llb/convert.go \
            frontend/dockerfile/dockerfile_context_access_test.go
          test "$(git diff --name-only)" = \
            'frontend/dockerfile/dockerfile2llb/convert.go'
          git diff --check

      - name: Compile converter and frontend packages
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=vendor ./frontend/dockerfile/dockerfile2llb -run '^$'
          go test -mod=vendor ./frontend/dockerfile -run '^$'

      - name: Materialize source-only candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/dockerfile/dockerfile2llb/convert.go \
            frontend/dockerfile/dockerfile_context_access_test.go
          git rm \
            .github/fieldwork/apply-unused-context-lazy.py \
            .github/patches/unused-context-lazy-main-context.patch \
            .github/workflows/fieldwork-materialize-unused-context-lazy.yml
          git commit -m 'dockerfile: avoid loading unused default context'
          test "$(git diff --name-only "$BASE_SHA" HEAD | sort)" = $'frontend/dockerfile/dockerfile2llb/convert.go\nfrontend/dockerfile/dockerfile_context_access_test.go'
          git diff --check "$BASE_SHA" HEAD
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:"$TARGET_BRANCH"
