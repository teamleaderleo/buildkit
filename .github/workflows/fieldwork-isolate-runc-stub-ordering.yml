name: Isolate runc mount-stub ordering

on:
  pull_request:
    paths:
      - .github/fieldwork/isolate-runc-stub-ordering.py
      - .github/workflows/fieldwork-isolate-runc-stub-ordering.yml

permissions:
  contents: write

concurrency:
  group: isolate-runc-stub-ordering-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_HEAD: 3e7204694acc659ce83e0b2d159acc45f928f9b9
  SOURCE_BRANCH: source/runc-finalized-mount-stub-cleanup-v2

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify carrier and preserve generator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD "$SOURCE_HEAD")" = "$SOURCE_HEAD"
          expected=$(printf '%s\n' \
            .github/fieldwork/isolate-runc-stub-ordering.py \
            .github/workflows/fieldwork-isolate-runc-stub-ordering.yml | sort)
          actual=$(git diff --name-only "$SOURCE_HEAD..HEAD" | sort)
          test "$actual" = "$expected"
          git diff --check "$SOURCE_HEAD..HEAD"
          python -m py_compile .github/fieldwork/isolate-runc-stub-ordering.py
          cp .github/fieldwork/isolate-runc-stub-ordering.py \
            "$RUNNER_TEMP/isolate-runc-stub-ordering.py"

      - name: Check out retained parity fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: teamleaderleo/buildkit
          ref: fe658b9120fc175f12c83a58ff925c2a1ea20ed2
          persist-credentials: false
          path: accepted-carrier

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate isolated helper repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_HEAD"
          mkdir -p receipt
          python "$RUNNER_TEMP/isolate-runc-stub-ordering.py"
          gofmt -w executor/stubs.go
          test "$(git diff --name-only "$SOURCE_HEAD")" = executor/stubs.go
          git diff --check "$SOURCE_HEAD"
          git diff -- executor/stubs.go > receipt/source.diff
          {
            echo "carrier_head=${{ github.event.pull_request.head.sha }}"
            echo "source_head=$SOURCE_HEAD"
            echo "go=$(go version)"
          } > receipt/identity.txt

      - name: Run executor package tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          go test ./executor/... 2>&1 | tee receipt/executor-tests.log

      - name: Build candidate binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -trimpath -o bin/buildkitd ./cmd/buildkitd
          go build -trimpath -o bin/buildctl ./cmd/buildctl

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rootlesskit runc uidmap
          user=$(id -un)
          grep -q "^${user}:" /etc/subuid || echo "${user}:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^${user}:" /etc/subgid || echo "${user}:100000:65536" | sudo tee -a /etc/subgid
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Start matching runc workers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bk-rootful /tmp/bk-rootless /tmp/bk-rootless-runtime /tmp/bk-rootlesskit
          sudo ./bin/buildkitd \
            --root /tmp/bk-rootful \
            --addr unix:///tmp/bk-rootful.sock \
            --oci-worker-snapshotter=native \
            --containerd-worker=false \
            > /tmp/buildkitd-rootful.log 2>&1 &
          echo $! > /tmp/buildkitd-rootful.pid

          XDG_RUNTIME_DIR=/tmp/bk-rootless-runtime \
          rootlesskit \
            --state-dir=/tmp/bk-rootlesskit \
            --net=host \
            ./bin/buildkitd \
              --root /tmp/bk-rootless \
              --addr unix:///tmp/bk-rootless.sock \
              --oci-worker-snapshotter=native \
              --containerd-worker=false \
            > /tmp/buildkitd-rootless.log 2>&1 &
          echo $! > /tmp/buildkitd-rootless.pid

          for _ in $(seq 1 120); do
            if [ -S /tmp/bk-rootful.sock ] && [ -S /tmp/bk-rootless.sock ]; then
              sudo chmod 666 /tmp/bk-rootful.sock
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buildkitd-rootful.log
          cat /tmp/buildkitd-rootless.log
          exit 1

      - name: Verify implicit mountpoint parity
        shell: bash
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" \
          ROOTFUL_ADDR=unix:///tmp/bk-rootful.sock \
          ROOTLESS_ADDR=unix:///tmp/bk-rootless.sock \
          /bin/sh accepted-carrier/linux-fieldwork/repro-rootless-oci.sh \
            | tee receipt/rootless-repro-implicit.log

      - name: Verify pre-existing mountpoints are preserved
        shell: bash
        run: |
          set -euo pipefail
          PATH="$PWD/bin:$PATH" \
          ROOTFUL_ADDR=unix:///tmp/bk-rootful.sock \
          ROOTLESS_ADDR=unix:///tmp/bk-rootless.sock \
          PRECREATE_RUNTIME_DIRS=1 \
          /bin/sh accepted-carrier/linux-fieldwork/repro-rootless-oci.sh \
            | tee receipt/rootless-repro-explicit.log

      - name: Stop workers
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/bk-rootless.pid ]; then kill "$(cat /tmp/bk-rootless.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/bk-rootful.pid ]; then sudo kill "$(cat /tmp/bk-rootful.pid)" 2>/dev/null || true; fi

      - name: Publish isolated source successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$SOURCE_HEAD")" = executor/stubs.go
          git diff --check "$SOURCE_HEAD"
          git config user.name 'Fieldwork Agent'
          git config user.email 'fieldwork-agent@users.noreply.github.com'
          git checkout -B "$SOURCE_BRANCH"
          git add executor/stubs.go
          git diff --cached --check
          git commit -m 'executor: isolate finalized-spec stub ordering'
          git push --force-with-lease origin "HEAD:refs/heads/$SOURCE_BRANCH"

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolate-runc-stub-ordering
          path: receipt/
          if-no-files-found: warn
